name: Renhetssjekk

# INERT: Actions er slått av for dette repoet (beslutning BK 2026-08-24), så
# denne workflowen kjører ikke. Den står igjen fordi å skru den på er én bryter,
# og fordi reglene den kjører er de samme som gjelder lokalt.
#
# Porten som FAKTISK gjelder er lokal, og kjøres før hver push:
#     git add -A && bash .github/renhet/sjekk.sh
#
# Repoet er en instruksjonskanal inn i andres Claude-økter: alt som havner på
# main blir arbeidsinstrukser hos alle som har installert pakken. Med Actions av,
# branch-hardening av og review droppet fram til 1.0 er den lokale kjøringen og
# maintainerens lesing av diffen de eneste portene som finnes.
#
# Reglene med begrunnelser: docs/installasjon.md, «Renhetskrav».

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renhet:
    name: Renhetskrav
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kjør renhetssjekken
        run: bash .github/renhet/sjekk.sh
